[Command]
Name=Paste as CSV Line
Command="
    copyq:
    var rows = selectedItems()
    var text = ''
    for (var i = 0; i < rows.length; ++i) {
      text += str(read(rows[i])) + ' '
    }
    var result = ''
    var inSeparator = false
    for (var j = 0; j < text.length; ++j) {
      var ch = text.charAt(j)
      var code = text.charCodeAt(j)
      if (ch === ' ' || code === 9 || code === 10 || code === 13) {
        if (!inSeparator) {
          result += ','
          inSeparator = true
        }
      } else {
        result += ch
        inSeparator = false
      }
    }
    result = result.replace(/^,+|,+$/g, '')
    copy(result)
    paste()"
InMenu=true
HideWindow=true
Icon=