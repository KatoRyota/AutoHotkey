[Command]
Name=Paste as Quote with Blank Line
Command="
    copyq:
    var rows = selectedItems()
    var parts = []
    for (var i = 0; i < rows.length; ++i) {
      parts.push(str(read(rows[i])))
    }
    var nl = String.fromCharCode(10)
    var text = parts.join(nl + nl)
    var lines = text.split(nl)
    for (var j = 0; j < lines.length; ++j) {
      lines[j] = '> ' + lines[j]
    }
    var result = lines.join(nl)
    copy(result)
    paste()"
InMenu=true
HideWindow=true
Icon=