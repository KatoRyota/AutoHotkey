[Command]
Name=Paste Clipboard as Plain Text
Command="
    copyq:
    function cleanText(s) {
      s = str(s)

      var out = ''
      for (var i = 0; i < s.length; ++i) {
        var ch = s.charCodeAt(i)

        // FEFF(BOM)を削除
        if (ch === 0xFEFF)
          continue

        // 改行(LF=10)・復帰(CR=13)・タブ(HT=9)以外のASCII制御文字とDEL(127)を削除
        if ((ch >= 0 && ch <= 8) || ch === 11 || ch === 12 || (ch >= 14 && ch <= 31) || ch === 127)
          continue

        // NBSP系・幅付きスペースを半角スペースへ置換
        // 全角スペース(U+3000)は保持
        if (ch === 0x00A0 || ch === 0x1680 || (ch >= 0x2000 && ch <= 0x200A) || ch === 0x202F || ch === 0x205F) {
          out += ' '
          continue
        }

        out += s.charAt(i)
      }

      return out
    }

    var text = cleanText(str(clipboard()))
    copy(text)
    paste()"
IsGlobalShortcut=true
HideWindow=true
Icon=
GlobalShortcut=f14