[Command]
Name=選択中のアイテムをカンマ区切りで貼り付け
Command="
    copyq:
    var rows = selectedItems();
    if (!rows.length) abort();

    var text = \"\";

    for (var i = 0; i < rows.length; ++i) {
        text += str(read(rows[i])) + \" \";
    }

    var result = text.replace(/[ \\t\\r\\n]+/g, \",\").replace(/^,+|,+$/g, \"\");

    if (!result) abort();

    copy(result);
    paste();
    "
InMenu=true
HideWindow=true
Icon=