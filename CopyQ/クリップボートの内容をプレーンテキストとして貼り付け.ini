[Command]
Name=クリップボートの内容をプレーンテキストとして貼り付け
Command="
    copyq:
    function cleanText(s) {
        s = str(s);

        var out = \"\";
        for (var i = 0; i < s.length; ++i) {
            var ch = s.charCodeAt(i);

            // FEFF(BOM/不可視文字)を削除
            if (ch === 0xfeff) continue;

            // ゼロ幅系・不可視ハイフンを削除
            if (
                ch === 0x00ad || // SOFT HYPHEN
                ch === 0x200b || // ZERO WIDTH SPACE
                ch === 0x200c || // ZERO WIDTH NON-JOINER
                ch === 0x200d || // ZERO WIDTH JOINER
                ch === 0x2060 // WORD JOINER
            )
                continue;

            // 改行(LF=10)・復帰(CR=13)・タブ(HT=9)以外のASCII制御文字とDEL(127)を削除
            if (
                (ch >= 0 && ch <= 8) ||
                ch === 11 ||
                ch === 12 ||
                (ch >= 14 && ch <= 31) ||
                ch === 127
            )
                continue;

            // NBSP系・幅付きスペースを半角スペースへ置換
            // 全角スペース(U+3000)は保持
            if (
                ch === 0x00a0 ||
                ch === 0x1680 ||
                (ch >= 0x2000 && ch <= 0x200a) ||
                ch === 0x202f ||
                ch === 0x205f
            ) {
                out += \" \";
                continue;
            }

            out += s.charAt(i);
        }

        return out;
    }

    var text = cleanText(str(clipboard()));
    copy(text);
    paste();
    "
IsGlobalShortcut=true
HideWindow=true
Icon=
GlobalShortcut=f14