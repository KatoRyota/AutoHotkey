[Command]
Name=選択中のアイテムの文字数を表示
Command="
    copyq:
    var rows = selectedItems();
    if (!rows.length) abort();

    var total = 0;

    for (var i = 0; i < rows.length; ++i) {
        var text = str(read(rows[i]));
        total += text.length;
    }

    dialog(
        \".title\", \"文字数\",
        \".label\", \"選択項目の合計: \" + total + \"文字\"
    );"
InMenu=true
Icon=