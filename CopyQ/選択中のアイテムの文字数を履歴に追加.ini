[Command]
Name=選択中のアイテムの文字数を履歴に追加
Command="
    copyq:
    var rows = selectedItems();
    if (!rows.length) abort();

    var total = 0;

    for (var i = 0; i < rows.length; ++i) {
        var text = str(read(rows[i]));
        total += text.length;
    }

    add(\"選択項目の合計: \" + total + \"文字\");
    "
InMenu=true
Icon=