[Command]
Name=選択中のアイテムを引用形式で貼り付け
Command="
    copyq:
    var rows = selectedItems();
    if (!rows.length) abort();

    function detectNewline(text) {
        if (text.indexOf(\"\\r\\n\") !== -1) return \"\\r\\n\";
        if (text.indexOf(\"\\n\") !== -1) return \"\\n\";
        if (text.indexOf(\"\\r\") !== -1) return \"\\r\";
        return \"\\n\";
    }

    function quoteText(text) {
        text = str(text);
        var nl = detectNewline(text);
        var lines;

        if (nl === \"\\r\\n\") lines = text.split(\"\\r\\n\");
        else if (nl === \"\\r\") lines = text.split(\"\\r\");
        else lines = text.split(\"\\n\");

        for (var i = 0; i < lines.length; ++i) {
            lines[i] = \"> \" + lines[i];
        }

        return lines.join(nl);
    }

    var parts = [];

    for (var i = 0; i < rows.length; ++i) {
        parts.push(quoteText(read(rows[i])));
    }

    var result = parts.join(\"\\n\\n\");
    copy(result);
    paste();
    "
InMenu=true
HideWindow=true
Icon=