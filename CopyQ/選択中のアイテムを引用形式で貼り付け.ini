[Command]
Name=選択中のアイテムを引用形式で貼り付け
Command="
    copyq:
    var rows = selectedItems();
    if (!rows.length) abort();

    var parts = [];

    for (var i = 0; i < rows.length; ++i) {
        parts.push(str(read(rows[i])));
    }

    var nl = \"\\n\";
    var joinedText = parts.join(nl + nl);
    var lines = joinedText.split(nl);

    for (var j = 0; j < lines.length; ++j) {
        lines[j] = \"> \" + lines[j];
    }

    var result = lines.join(nl);
    copy(result);
    paste();
    "
InMenu=true
HideWindow=true
Icon=