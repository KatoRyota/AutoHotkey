[Command]
Name=Paste as Plain Text
Command="
    copyq:
    var rows = selectedItems()
    var parts = []

    function cleanText(s) {
      s = str(s)

      // 改行(CR/LF)とタブ(HT)以外のASCII制御文字を削除
      s = s.replace(/[\\x00-\\x08\\x0B\\x0C\\x0E-\\x1F\\x7F]/g, '')

      // FEFF(BOM)を削除
      s = s.replace(/\\uFEFF/g, '')

      // NBSP系・幅付きスペースを半角スペースへ置換
      // 全角スペース(U+3000)は保持
      s = s.replace(/[\\u00A0\\u1680\\u2000-\\u200A\\u202F\\u205F]/g, ' ')

      return s
    }

    for (var i = 0; i < rows.length; ++i) {
      parts.push(cleanText(read(rows[i])))
    }

    var nl = String.fromCharCode(10)
    var text = parts.join(nl)

    copy(text)
    paste()"
InMenu=true
HideWindow=true
Icon=